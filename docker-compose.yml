services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: it_device_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: itdeviceregister
      TZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. MinIO Local Object Storage
  minio:
    image: minio/minio:latest
    container_name: it_device_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
      TZ: Asia/Bangkok
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # 3. IT Device Register Next.js Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: it_device_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/itdeviceregister?schema=public"
      JWT_SECRET: "super-secret-jwt-key-change-in-production-2026"
      NEXTAUTH_URL: "http://localhost:3000"
      TZ: "Asia/Bangkok"
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  minio_data:
  uploads_data:
